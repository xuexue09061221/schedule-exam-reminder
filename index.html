<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="课表提醒">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
<title>课表 &amp; 考试提醒</title>
<style>
  :root{
    --bg:#eef1f8; --card:#ffffff; --ink:#1f2430; --sub:#6b7280;
    --line:#e5e9f2; --accent:#6366f1; --accent2:#8b5cf6; --danger:#ef4444; --ok:#10b981;
    --radius:16px; --shadow:0 6px 24px rgba(31,41,80,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:14px}
  body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#eef1f8 0%,#e6ebf7 100%);color:var(--ink);min-height:100vh;padding-bottom:90px}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}
  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 20px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem}
  .brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.2rem;box-shadow:0 4px 12px rgba(99,102,241,.35)}
  .brand small{display:block;font-size:.72rem;color:var(--sub);font-weight:400}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:10px;font-size:.85rem;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent);background:#f7f7ff}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.3)}
  .btn.primary:hover{filter:brightness(1.06);color:#fff}
  .btn.danger:hover{border-color:var(--danger);color:var(--danger)}
  .status{font-size:.8rem;color:var(--sub)}
  .wrap{max-width:1180px;margin:0 auto;padding:16px 18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:16px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;border:1px solid rgba(255,255,255,.6)}
  .card h3{font-size:.82rem;color:var(--sub);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .big{font-size:1.5rem;font-weight:800}
  .pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.75rem;background:#eef2ff;color:var(--accent);font-weight:600}
  .pill.warn{background:#fff7ed;color:#ea580c}
  .pill.ok{background:#ecfdf5;color:#059669}
  .pill.gray{background:#f1f3f6;color:#6b7280}
  .row{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:.85rem;margin-top:4px}
  .sec{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px;border:1px solid rgba(255,255,255,.6)}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
  .sec-head h2{font-size:1.05rem;display:flex;align-items:center;gap:8px}
  .tbl-head{display:grid;grid-template-columns:52px repeat(7,1fr);gap:0;border-bottom:1px solid var(--line)}
  .tbl-head div{text-align:center;font-size:.78rem;padding:8px 2px;color:var(--sub);border-left:1px solid var(--line)}
  .tbl-head div:first-child{border-left:none}
  .tbl-head .today-h{color:var(--accent);font-weight:700}
  .grid-body{display:grid;grid-template-columns:52px repeat(7,1fr);position:relative;background:repeating-linear-gradient(to bottom,#fff 0px,#fff 59px,#edf0f8 59px,#edf0f8 60px);border-radius:0 0 12px 12px;overflow:hidden}
  .gutter{position:relative;height:840px}
  .gutter span{position:absolute;right:8px;font-size:.68rem;color:#9aa1b2;transform:translateY(-50%)}
  .day-col{position:relative;height:840px;border-left:1px solid var(--line)}
  .day-col.today{background:rgba(99,102,241,.035)}
  .course{position:absolute;left:4px;right:4px;border-radius:9px;padding:6px 7px;font-size:.74rem;line-height:1.35;color:#fff;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.12);cursor:pointer;transition:transform .1s}
  .course:hover{transform:scale(1.02);z-index:5}
  .course b{display:block;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .course .meta{opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now-line{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:6;pointer-events:none}
  .now-line::after{content:"现在";position:absolute;right:0;top:-9px;font-size:.62rem;color:#fff;background:var(--danger);padding:1px 5px;border-radius:6px}
  .empty-tip{color:#9aa1b2;text-align:center;padding:40px 10px;font-size:.9rem}
  .exam-item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
  .exam-item:last-child{border-bottom:none}
  .exam-item .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .exam-item .name{font-weight:600;min-width:120px}
  .exam-item .when{color:var(--sub);font-size:.85rem;flex:1;min-width:140px}
  .exam-item .del{margin-left:auto}
  .footer{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.85rem;z-index:40}
  .footer label{display:flex;align-items:center;gap:6px;color:var(--sub)}
  .footer input[type=number]{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:8px}
  .footer input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
  .overlay{position:fixed;inset:0;background:rgba(23,25,40,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:18px;width:100%;max-width:460px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
  .modal h2{margin-bottom:16px;font-size:1.15rem}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-grid .full{grid-column:1/-1}
  .field label{display:block;font-size:.8rem;color:var(--sub);margin-bottom:5px}
  .field input,.field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font-size:.9rem;background:#fbfcfe;outline:none}
  .field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
  .modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .toast-wrap{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{background:#1f2430;color:#fff;padding:10px 18px;border-radius:12px;font-size:.85rem;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .25s ease;max-width:88vw}
  @keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @media(max-width:820px){
    .grid-body,.tbl-head{overflow-x:auto}
    .day-col{min-width:120px}
  }
  /* ===== 图片排课 ===== */
  .imgzone{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;background:#fafbff;margin:8px 0}
  .imgzone .btn{margin:0 6px}
  .imgtip{font-size:.8rem;color:var(--sub);background:#f6f7ff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px;line-height:1.6}
  #imgCanvas{max-width:100%;border-radius:12px;border:1px solid var(--line);margin-top:10px;background:#fff}
  .ocrbar{display:flex;align-items:center;gap:10px;background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;padding:8px 12px;margin-top:10px;font-size:.85rem}
  .ocrbar progress{flex:1}
  .rev-row{display:grid;grid-template-columns:auto 92px 1.4fr 86px 86px 1fr auto;gap:6px;align-items:center;padding:6px 2px;border-bottom:1px dashed var(--line);font-size:.83rem}
  .rev-row input,.rev-row select{padding:6px 7px;border:1px solid var(--line);border-radius:8px;font-size:.83rem;background:#fbfcfe;min-width:0;width:100%}
  .rev-head{display:grid;grid-template-columns:auto 92px 1.4fr 86px 86px 1fr auto;gap:6px;padding:4px 2px;color:var(--sub);font-size:.72rem;border-bottom:1px solid var(--line);font-weight:600}
  .rev-miss{background:#fff7ed}
  #imgReview{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:6px}
  .periodbox{width:100%;height:76px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:.8rem;background:#fbfcfe;font-family:inherit}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">📅</div>
    <div>课表 &amp; 考试提醒<small>大学生 AI 实战 · 单文件本地运行 · <b style="color:#6366f1">v3.1</b></small></div>
  </div>
  <div class="status" id="status"></div>
  <div class="actions">
    <button class="btn" id="btnSample" title="载入一套示例课表，方便体验">✨ 载入示例</button>
    <button class="btn primary" id="btnImg">📷 图片排课</button>
    <button class="btn" id="btnExport">⬇ 导出</button>
    <button class="btn" id="btnImport">⬆ 导入</button>
    <button class="btn danger" id="btnClear">🗑 清空</button>
    <input type="file" id="fileInput" accept=".json" style="display:none">
  </div>
</header>

<main class="wrap">
  <section class="cards" id="summary"></section>

  <section class="sec">
    <div class="sec-head">
      <h2>🗓 本周课表</h2>
      <button class="btn primary" id="btnAddCourse">＋ 添加课程</button>
    </div>
    <div class="tbl-head" id="tblHead"></div>
    <div class="grid-body" id="gridBody"></div>
  </section>

  <section class="sec">
    <div class="sec-head">
      <h2>📝 考试倒计时</h2>
      <button class="btn primary" id="btnAddExam">＋ 添加考试</button>
    </div>
    <div id="examList"></div>
  </section>
</main>

<footer class="footer">
  <label><input type="checkbox" id="notifyOn"> 开启系统通知提醒</label>
  <label>上课提前 <input type="number" id="courseLead" min="0" max="120"> 分钟提醒</label>
  <label>考试提前 <input type="number" id="examLead" min="0" max="1440"> 分钟提醒</label>
  <span class="status">数据保存在本机浏览器，可随时导出备份</span>
</footer>

<!-- 课程弹窗 -->
<div class="overlay" id="ovCourse">
  <div class="modal">
    <h2 id="courseModalTitle">添加课程</h2>
    <div class="form-grid">
      <div class="field full"><label>课程名称 *</label><input id="cName" placeholder="例如：高等数学"></div>
      <div class="field"><label>星期</label><select id="cDay"></select></div>
      <div class="field"><label>颜色</label><select id="cColor"></select></div>
      <div class="field"><label>开始时间</label><input type="time" id="cStart" value="08:00"></div>
      <div class="field"><label>结束时间</label><input type="time" id="cEnd" value="09:40"></div>
      <div class="field full"><label>地点</label><input id="cLoc" placeholder="例如：教1-101"></div>
      <div class="field full"><label>教师（选填）</label><input id="cTeacher" placeholder="选填"></div>
    </div>
    <div class="modal-btns">
      <button class="btn" id="courseDel" style="margin-right:auto;display:none">删除</button>
      <button class="btn" id="courseCancel">取消</button>
      <button class="btn primary" id="courseSave">保存</button>
    </div>
  </div>
</div>

<!-- 考试弹窗 -->
<div class="overlay" id="ovExam">
  <div class="modal">
    <h2 id="examModalTitle">添加考试</h2>
    <div class="form-grid">
      <div class="field full"><label>考试科目 *</label><input id="eName" placeholder="例如：高等数学期中"></div>
      <div class="field"><label>日期</label><input type="date" id="eDate"></div>
      <div class="field"><label>时间</label><input type="time" id="eTime" value="09:00"></div>
      <div class="field full"><label>地点（选填）</label><input id="eLoc" placeholder="例如：教2-201"></div>
    </div>
    <div class="modal-btns">
      <button class="btn" id="examDel" style="margin-right:auto;display:none">删除</button>
      <button class="btn" id="examCancel">取消</button>
      <button class="btn primary" id="examSave">保存</button>
    </div>
  </div>
</div>

<div class="overlay" id="ovImg">
  <div class="modal" style="max-width:760px">
    <h2>📷 图片自动排课</h2>
    <div class="imgtip">上传你的<b>课表截图</b>（教务系统 / 课表 App 的横平竖直表格效果最好）。系统会自动识别网格和文字，生成可校对的课表，确认后一键导入。首次使用需下载中文识别包（约 1.7MB），请耐心等待。</div>
    <div class="imgzone" id="imgZone">
      <input type="file" id="imgFile" accept="image/*" style="display:none">
      <button class="btn primary" id="btnPickImg">📁 选择课表图片</button>
      <span class="status">支持 JPG / PNG 截图</span>
    </div>
    <canvas id="imgCanvas" style="display:none"></canvas>
    <div class="ocrbar" id="ocrBar" style="display:none">
      <span id="ocrText">准备中…</span>
      <progress id="ocrProg" value="0" max="100"></progress>
      <button class="btn" id="btnAbortOcr">取消</button>
    </div>
    <div style="margin-top:10px" id="imgResult"></div>
    <div id="imgReviewWrap" style="display:none">
      <div class="sec-head" style="margin-top:10px">
        <h2>📋 校对识别结果（可改）</h2>
        <button class="btn primary" id="btnImportImg">✅ 导入选中课表</button>
      </div>
      <div class="rev-head"><span></span><span>星期</span><span>课程名称</span><span>开始</span><span>结束</span><span>地点</span><span></span></div>
      <div id="imgReview"></div>
      <details style="margin-top:8px"><summary style="cursor:pointer;font-size:.8rem;color:var(--sub)">⚙️ 节次↔时间对照表（按需修改，每行：节次 开始-结束）</summary>
      <textarea class="periodbox" id="periodTxt" style="margin-top:6px">1 08:00-09:40
2 10:00-11:40
3 14:00-15:40
4 16:00-17:40
5 19:00-20:40
6 08:00-09:40
7 10:00-11:40
8 14:00-15:40
9 16:00-17:40
10 19:00-20:40</textarea></details>
    </div>
    <div class="modal-btns"><button class="btn" id="imgCancel">关闭</button></div>
  </div>
</div>
<div class="toast-wrap" id="toasts"></div>

<script>
'use strict';
/* ============ 数据 ============ */
const KEY='schedule_exam_reminder_v1';
const NK='schedule_exam_reminder_notified_v1';
const DAYS=['周一','周二','周三','周四','周五','周六','周日'];
const COLORS=['#6366f1','#0ea5e9','#10b981','#f59e0b','#ef4444','#ec4899','#8b5cf6','#14b8a6','#f97316','#84cc16','#3b82f6','#d946ef'];
let state=load()||{courses:[],exams:[],settings:{courseLead:10,examLead:60,notify:true}};

function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function notifiedLoad(){try{return new Set(JSON.parse(localStorage.getItem(NK)||'[]'))}catch(e){return new Set()}}
function notifiedSave(s){localStorage.setItem(NK,JSON.stringify([...s]))}
let notified=notifiedLoad();

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pad(n){return String(n).padStart(2,'0')}
function toMin(hhmm){const a=String(hhmm).split(':');return (+a[0])*60+(+a[1]||0)}
function minToHM(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmtCN(date){const m=date.getMonth()+1;const d=date.getDate();const w=DAYS[(date.getDay()+6)%7];return m+'月'+d+'日 '+w}
function fmtDur(min){if(min<1)return '马上';if(min<60)return min+' 分钟';if(min<60*24){const h=Math.floor(min/60);return h+' 小时 '+(min%60)+' 分'}const days=Math.floor(min/1440);return days+' 天 '+(Math.floor(min%1440/60))+' 小时'}

/* ============ 工具函数 ============ */
function colorFor(id){let h=0;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]}
function colorName(hex){const i=COLORS.indexOf(hex);return i>=0?COLORS[i]:hex}
function nextClass(){const now=new Date();let best=null,bestDiff=Infinity;for(let k=0;k<=7;k++){const day=new Date(now);day.setDate(now.getDate()+k);for(const c of state.courses){if(c.day!==((day.getDay()+6)%7+1))continue;const st=new Date(day);st.setHours(Math.floor(c.start/60),c.start%60,0,0);if(st>now){const diff=st-now;if(diff<bestDiff){bestDiff=diff;best={course:c,start:st}}}}}return best?{...best,diffMin:bestDiff/60000}:null}
function nextExam(){const now=new Date();let best=null,bestDiff=Infinity;for(const e of state.exams){const dt=new Date(e.date+'T'+e.time);if(dt>now){const diff=dt-now;if(diff<bestDiff){bestDiff=diff;best={exam:e,dt}}}}return best?{...best,diffMin:bestDiff/60000}:null}
function todayCourses(){const dow=(new Date().getDay()+6)%7+1;return state.courses.filter(c=>c.day===dow).sort((a,b)=>a.start-b.start)}

/* ============ 渲染：概览 ============ */
function renderSummary(){
  const nc=nextClass(),ne=nextExam(),tc=todayCourses();
  let cHtml='<div class="card"><h3>⏰ 下一节课</h3>';
  if(nc){cHtml+='<div class="pill">'+fmtDur(nc.diffMin)+'</div><div class="big" style="color:'+nc.course.color+'">'+esc(nc.course.name)+'</div><div class="row">'+DAYS[nc.course.day-1]+' '+minToHM(nc.course.start)+' – '+minToHM(nc.course.end)+(nc.course.loc?' · '+esc(nc.course.loc):'')+'</div>'}
  else cHtml+='<div style="color:#9aa1b2">本周没有更多课程啦 🎉</div>';
  cHtml+='</div>';
  let eHtml='<div class="card"><h3>🎯 下一场考试</h3>';
  if(ne){eHtml+='<div class="pill warn">'+fmtDur(ne.diffMin)+'</div><div class="big">'+esc(ne.exam.name)+'</div><div class="row">'+fmtCN(ne.dt)+' '+ne.exam.time+(ne.exam.loc?' · '+esc(ne.exam.loc):'')+'</div>'}
  else eHtml+='<div style="color:#9aa1b2">暂无考试安排 ✅</div>';
  eHtml+='</div>';
  let tHtml='<div class="card"><h3>📖 今日 '+tc.length+' 节课</h3>';
  if(tc.length){for(const c of tc){tHtml+='<div style="display:flex;align-items:center;gap:8px;padding:5px 0"><span style="width:9px;height:9px;border-radius:50%;background:'+c.color+';flex:none"></span><b style="flex:1;font-size:.9rem">'+esc(c.name)+'</b><span class="row" style="margin:0">'+minToHM(c.start)+'</span></div>'}}
  else tHtml+='<div style="color:#9aa1b2">今天没课，好好休息～</div>';
  tHtml+='</div>';
  document.getElementById('summary').innerHTML=cHtml+eHtml+tHtml;
}

/* ============ 渲染：周课表 ============ */
function renderTimetable(){
  const mon=mondayOf(new Date()),now=new Date(),dow=(now.getDay()+6)%7;
  const head=document.getElementById('tblHead');let hh='<div></div>';
  for(let i=0;i<7;i++){const d=addDays(mon,i);const isT=i===dow;hh+='<div class="'+(isT?'today-h':'')+'">'+DAYS[i]+'<br>'+d.getMonth()+1+'/'+d.getDate()+'</div>'}
  head.innerHTML=hh;
  const body=document.getElementById('gridBody');let g='<div class="gutter">';
  for(let h=8;h<=22;h++)g+='<span style="top:'+((h-8)*60+30)+'px">'+pad(h)+':00</span>';

/* ================= 图片自动排课 ================= */
const imgS={worker:null,abort:false,cells:[],entries:[],rowH:0,canvas:null};
function dayOf(t){const m=String(t||'').match(/[一二三四五六日]/);if(!m)return null;const s='一二三四五六日';return s.indexOf(m[0])+1}
function cleanCellText(t){return String(t||'').replace(/\s+/g,' ').trim()}
function isWeekRange(t){return /^\d{1,2}\s*[-－—~至到]?\s*\d{0,2}\s*周\s*$/.test(String(t||'').trim())}
function parsePeriodMap(txt){
  const map={};
  String(txt||'').split(/\r?\n/).forEach(ln=>{
    const m=ln.trim().match(/^(\d{1,2})\s+(\d{1,2}):(\d{2})\s*[-－—~至到]\s*(\d{1,2}):(\d{2})$/);
    if(m)map[+m[1]]=[+m[2]*60+(+m[3]),+m[4]*60+(+m[5])];
  });
  return map;
}
function parseTimes(text,pmap){
  const m1=String(text||'').match(/(\d{1,2})[:：](\d{2})\s*[-－—~至到]\s*(\d{1,2})[:：](\d{2})/);
  if(m1)return {s:(+m1[1])*60+(+m1[2]),e:(+m1[3])*60+(+m1[4])};
  const m2=String(text||'').match(/第?\s*(\d{1,2})\s*[-－—~至到]?\s*(\d{0,2})\s*节/);
  if(m2){const p1=+m2[1],p2=m2[2]?+m2[2]:p1;const a=pmap[p1],b=pmap[p2];if(a)return {s:a[0],e:b?b[1]:a[1]}}
  return null;
}
function guessLoc(lines){
  const locRe=/(教|楼|馆|室|区|座|阶|机房|操场|实验|报告厅)[A-Za-z0-9-－—]*/;
  for(const ln of lines){if(ln&&locRe.test(ln)&&/\d/.test(ln))return ln}
  for(const ln of lines){if(ln&&/\d/.test(ln)&&!isWeekRange(ln)&&!/^(\d{1,2})[:：]/.test(ln))return ln}
  return '';
}
function loadOCR(){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=()=>res();s.onerror=()=>rej(new Error('OCR 引擎下载失败，请检查网络'));document.head.appendChild(s)})}
function setOcr(t,p){const bar=document.getElementById('ocrBar');bar.style.display='flex';document.getElementById('ocrText').textContent=t;const pr=document.getElementById('ocrProg');pr.value=p||0}
function hideOcr(){document.getElementById('ocrBar').style.display='none'}
function openImg(){imgS.abort=false;document.getElementById('ovImg').classList.add('show');document.getElementById('imgResult').innerHTML='';document.getElementById('imgReviewWrap').style.display='none';document.getElementById('imgCanvas').style.display='none'}
document.getElementById('btnImg').addEventListener('click',openImg);
document.getElementById('imgCancel').addEventListener('click',()=>{imgS.abort=true;document.getElementById('ovImg').classList.remove('show')});
document.getElementById('btnPickImg').addEventListener('click',()=>document.getElementById('imgFile').click());

async function runImageOCR(cv){
  imgS.canvas=cv;imgS.abort=false;
  document.getElementById('imgResult').innerHTML='';
  setOcr('准备 OCR 引擎…',5);
  try{await loadOCR()}catch(e){hideOcr();document.getElementById('imgResult').innerHTML='<span style="color:var(--danger)">'+esc(e.message)+'</span>';return}
  const grid=detectGrid(cv);
  if(!grid){hideOcr();document.getElementById('imgResult').innerHTML='<span style="color:var(--danger)">未识别到表格线。请上传横平竖直的课表<b>截图</b>（避免拍照歪斜/模糊）。</span>';return}
  const {xs,ys}=grid;
  imgS.rowH=ys.length-1;
  setOcr('下载中文识别包(首次约1.7MB)…',15);
  let worker;
  try{
    worker=await Tesseract.createWorker('chi_sim',1,{logger:()=>{},langPath:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/chi_sim/4.0.0_best_int'});
    imgS.worker=worker;
  }catch(e){hideOcr();document.getElementById('imgResult').innerHTML='<span style="color:var(--danger)">识别引擎启动失败：'+esc(e.message)+'</span>';return}
  const ctx2=cv.getContext('2d');
  const texts=[];
  const total=(xs.length-1)*(ys.length-1);
  let done=0,skipped=0;
  for(let r=0;r<ys.length-1;r++){
    texts.push([]);
    for(let col=0;col<xs.length-1;col++){
      if(imgS.abort){try{worker.terminate()}catch(e){}imgS.worker=null;hideOcr();document.getElementById('imgResult').innerHTML='<span class="status">已取消识别</span>';return}
      const x0=Math.max(0,Math.round(xs[col])),y0=Math.max(0,Math.round(ys[r])),x1=Math.min(cv.width,Math.round(xs[col+1])),y1=Math.min(cv.height,Math.round(ys[r+1]));
      const w=x1-x0,h=y1-y0;
      let dark=0,tot=0;
      if(w>2&&h>2){const d=ctx2.getImageData(x0,y0,w,h).data;for(let i=0;i<d.length;i+=4){tot++;if((d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11)<150)dark++}}
      let cellTxt='';
      if(dark/tot>0.004){
        try{
          setOcr('识别中 '+done+' / '+total,15+Math.round(done/total*70));
          const crop=document.createElement('canvas');crop.width=w;crop.height=h;
          crop.getContext('2d').drawImage(cv,x0,y0,w,h,0,0,w,h);
          const rr=await worker.recognize(crop);
          cellTxt=cleanCellText(rr.data.text);
        }catch(e){cellTxt=''}
      }
      if(cellTxt)done++;else skipped++;
      texts[r].push(cellTxt);
    }
  }
  try{worker.terminate()}catch(e){}imgS.worker=null;
  if(imgS.abort){hideOcr();return}
  buildReview(texts,xs.length-1);
}
function detectGrid(cv){
  const ctx2=cv.getContext('2d');const {width:W,height:H}=cv;
  const d=ctx2.getImageData(0,0,W,H).data;
  const lum=Array.from({length:W*H},(_,i)=>{const j=i*4;return (d[j]*0.3+d[j+1]*0.59+d[j+2]*0.11)});
  function lines(horizontal){
    const out=[];const len=horizontal?H:W,span=horizontal?W:H;
    let run=false,start=0;
    const arr=[];
    for(let i=0;i<len;i++){
      let cnt=0;
      for(let j=0;j<span;j++){const idx=horizontal?i*W+j:j*W+i;if(lum[idx]<150)cnt++}
      const thick=horizontal?(span>0?cnt/span:0):(span>0?cnt/span:0);
      const on=thick>0.28;
      if(on&&!run){run=true;start=i}
      if((!on||i===len-1)&&run){
        const end=i-(on?0:1);
        if(end-start>=1){out.push(Math.round((start+end)/2))}
        run=false;
      }
    }
    return out;
  }
  const xs=lines(false),ys=lines(true);
  if(xs.length<3||ys.length<3)return null;
  /* 合并过近的线 */
  function prune(a){const r=[];for(const v of a){if(r.length&&v-r[r.length-1]<5)continue;r.push(v)}return r}
  const xs2=prune(xs),ys2=prune(ys);
  if(xs2.length<3||ys2.length<3)return null;
  return {xs:xs2,ys:ys2};
}
function buildReview(texts,nCols){
  const pmap=parsePeriodMap(document.getElementById('periodTxt').value);
  /* 找表头行：从上往下第一个包含星期字的行 */
  let headerR=0;
  outer:for(let r=0;r<texts.length;r++){
    let has=false;
    for(let c=0;c<nCols;c++){if(texts[r]&&dayOf(texts[r][c])){has=true}}
    if(has){headerR=r;break outer}
  }
  const dayCols=[];
  for(let c=0;c<nCols;c++){const d=texts[headerR]?dayOf(texts[headerR][c]):null;if(d)dayCols.push({c,d})}
  dayCols.sort((a,b)=>a.c-b.c);
  if(!dayCols.length){document.getElementById('imgResult').innerHTML='<span style="color:var(--danger)">未在表头识别到星期，请换更清晰的截图。</span>';return}
  const firstDayCol=Math.min(...dayCols.map(x=>x.c));
  const timeCol=firstDayCol>0?firstDayCol-1:-1;
  const entries=[];
  for(let r=headerR+1;r<texts.length;r++){
    const timeText=timeCol>=0&&texts[r]&&texts[r][timeCol]?texts[r][timeCol]:'';
    const tm=parseTimes(timeText,pmap);
    for(const dc of dayCols){
      const raw=texts[r]&&texts[r][dc.c]?texts[r][dc.c]:'';
      if(!raw||isWeekRange(raw)||/^\d{1,2}$/.test(raw))continue;
      const lines=String(raw).split(' ').map(s=>s.trim()).filter(Boolean);
      const content=lines.filter(l=>!isWeekRange(l)&&!/^(周[一二三四五六日]|星期[一二三四五六日])$/.test(l));
      if(!content.length)continue;
      const name=content[0].slice(0,40);
      if(name.length<1)continue;
      entries.push({day:dc.d,name,loc:guessLoc(content),s:tm?tm.s:'',e:tm?tm.e:'',raw,checked:true});
    }
  }
  imgS.entries=entries;
  renderReview();
}
function renderReview(){
  const wrap=document.getElementById('imgReviewWrap');wrap.style.display='block';
  const box=document.getElementById('imgReview');
  if(!imgS.entries.length){box.innerHTML='<div class="empty-tip">没有识别到课程内容，请换更清晰的截图后重试。</div>';document.getElementById('imgResult').innerHTML='';return}
  document.getElementById('imgResult').innerHTML='<span class="status">共识别到 '+imgS.entries.length+' 条课程，请核对后导入。</span>';
  box.innerHTML=imgS.entries.map((e,i)=>{
    const opts='<option value="0">?周</option>'+DAYS.map((dd,j)=>'<option value="'+(j+1)+'"'+(e.day===j+1?' selected':'')+'>'+dd+'</option>').join('');
    return '<div class="rev-row'+(e.day&&e.s!==''&&e.e!==''?'':' rev-miss')+'">'
      +'<input type="checkbox" class="rchk" data-i="'+i+'"'+(e.checked?' checked':'')+'>'
      +'<select class="rday" data-i="'+i+'">'+opts+'</select>'
      +'<input class="rname" data-i="'+i+'" value="'+esc(e.name)+'">'
      +'<input type="time" class="rst" data-i="'+i+'" value="'+(e.s!==''?minToHM(e.s):'')+'">'
      +'<input type="time" class="ren" data-i="'+i+'" value="'+(e.e!==''?minToHM(e.e):'')+'">'
      +'<input class="rloc" data-i="'+i+'" value="'+esc(e.loc)+'">'
      +'<button class="btn danger" data-del="'+i+'" style="padding:3px 8px;font-size:.75rem">删</button></div>';
  }).join('');
  box.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',function(){const i=+this.dataset.del;imgS.entries.splice(i,1);renderReview()}));
  document.getElementById('imgReview').scrollTop=0;
  hideOcr();
}
document.getElementById('btnImportImg').addEventListener('click',function(){
  if(!imgS.entries||!imgS.entries.length){toast('没有可导入的数据');return}
  const rows=document.querySelectorAll('#imgReview .rev-row');
  let n=0,skip=0;
  rows.forEach(row=>{
    const chk=row.querySelector('.rchk');if(!chk||!chk.checked)return;
    const day=+row.querySelector('.rday').value;
    const name=row.querySelector('.rname').value.trim();
    const s=toMin(row.querySelector('.rst').value||'');
    const e=toMin(row.querySelector('.ren').value||'');
    const loc=row.querySelector('.rloc').value.trim();
    if(!name||!day||!row.querySelector('.rst').value||!row.querySelector('.ren').value||e<=s){skip++;return}
    state.courses.push({id:uid(),name,day,start:s,end:e,loc,teacher:'',color:colorFor(name)});
    n++;
  });
  if(n){save();renderAll()}
  toast(n>0?('已导入 '+n+' 门课程'+(skip?('，跳过 '+skip+' 条未填完整'):'')):'没有符合条件的课程（请检查星期/时间是否填好）');
  if(n)document.getElementById('ovImg').classList.remove('show');
});
</script>
